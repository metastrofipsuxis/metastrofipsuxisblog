name: Build static site

on:
  push:
    branches: [main]
    paths:
      - 'sitechunk_*.txt'
      - '.github/workflows/build-static.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild real index.html
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib, sys

          parts = []
          for i in range(6):
              p = pathlib.Path(f"sitechunk_{i}.txt")
              if not p.exists():
                  raise SystemExit(f"Missing {p}")
              parts.append(p.read_text(encoding="utf-8").strip())

          attempts = []

          # Method A: chunks are slices of one Base64 string.
          try:
              attempts.append(("joined-base64", base64.b64decode("".join(parts), validate=True)))
          except Exception as e:
              print("joined-base64 decode failed:", e)

          # Method B: every chunk was Base64-encoded separately.
          try:
              attempts.append(("separate-base64", b"".join(base64.b64decode(x, validate=True) for x in parts)))
          except Exception as e:
              print("separate-base64 decode failed:", e)

          html = None
          used = None
          for name, payload in attempts:
              try:
                  candidate = gzip.decompress(payload).decode("utf-8")
                  low = candidate.lower()
                  if "<html" in low and "μεταστροφή ψυχής" in low:
                      html = candidate
                      used = name
                      break
              except Exception as e:
                  print(name, "gzip/html validation failed:", e)

          if not html:
              raise SystemExit("Could not reconstruct a valid HTML page from the six chunks")

          pathlib.Path("index.html").write_text(html, encoding="utf-8")
          print("Built index.html using", used, "bytes:", len(html.encode("utf-8")))
          PY

      - name: Commit generated static index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already current"
          else
            git commit -m "Build direct static site [skip ci]"
            git push
          fi
