name: Restore full site
on:
  push:
    branches: [main]
    paths:
      - 'restorefull_*.txt'
      - 'olive-accent.css'
      - 'patch_site.py'
      - '.github/workflows/restore-full.yml'
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build full index
        shell: bash
        run: |
          cat restorefull_0.txt restorefull_1.txt restorefull_2.txt restorefull_3.txt restorefull_4.txt restorefull_5.txt restorefull_6.txt > index.html
          python3 patch_site.py
          grep -q 'ΠΟΙΟΣ ΕΙΜΑΙ' index.html
          grep -q 'metastrofi_posts' index.html
          grep -q 'metastrofi_messages' index.html
          grep -q 'Θεραπευτής έγινα' index.html
          grep -q 'data:image/webp;base64' index.html
          grep -q 'data-v="studio"' index.html
          grep -q 'OLIVE ACCENT + STRONGER CTA' index.html
          ! grep -q '<button data-r="studio">Studio</button>' index.html
          ! grep -q 'ιδιωτικό Studio' index.html
          test $(wc -c < index.html) -gt 120000
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/metastrofi-site.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/metastrofi-site.js
      - name: Publish restored site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish validated site build"
          git push
