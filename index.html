<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Μεταστροφή Ψυχής</title>
<style>
html,body{margin:0;min-height:100%;background:#f5ecde;color:#3e2b20;font-family:Georgia,"Times New Roman",serif}body{display:grid;place-items:center}.loading{padding:40px;text-align:center}.brand{font-size:28px;margin-bottom:12px}.note{font-size:16px;opacity:.7}
</style>
</head>
<body>
<div class="loading" id="status"><div class="brand">Μεταστροφή Ψυχής</div><div class="note">Φόρτωση…</div></div>
<script>
(async()=>{
  try{
    if(!('DecompressionStream' in window)) throw new Error('Το πρόγραμμα περιήγησης χρειάζεται ενημέρωση.');
    const files=Array.from({length:6},(_,i)=>`sitechunk_${i}.txt`);
    const parts=await Promise.all(files.map(async file=>{
      const r=await fetch(file,{cache:'no-store'});
      if(!r.ok) throw new Error(`Δεν φορτώθηκε ${file}`);
      return (await r.text()).trim();
    }));
    const raw=atob(parts.join('').replace(/\s/g,''));
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    document.getElementById('status').innerHTML='<div class="brand">Μεταστροφή Ψυχής</div><div class="note">Η σελίδα δεν φορτώθηκε. Κάνε ανανέωση ή άνοιξέ την σε ενημερωμένο Safari / Chrome.</div>';
  }
})();
</script>
</body>
</html>
