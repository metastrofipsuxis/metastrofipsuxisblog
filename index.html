<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Μεταστροφή Ψυχής</title>
<style>
html,body{margin:0;min-height:100%;background:#f5ecde;color:#3e2b20;font-family:Georgia,"Times New Roman",serif}body{display:grid;place-items:center}.loading{padding:40px;text-align:center}.brand{font-size:28px;margin-bottom:12px}.note{font-size:16px;opacity:.72;max-width:520px;line-height:1.6}
</style>
</head>
<body>
<div class="loading" id="status"><div class="brand">Μεταστροφή Ψυχής</div><div class="note">Φόρτωση…</div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  const fail=(msg)=>{status.innerHTML='<div class="brand">Μεταστροφή Ψυχής</div><div class="note">Η σελίδα δεν φορτώθηκε.<br>'+msg+'</div>'};
  try{
    const files=Array.from({length:6},(_,i)=>`sitechunk_${i}.txt`);
    const parts=await Promise.all(files.map(async file=>{
      const r=await fetch(file,{cache:'no-store'});
      if(!r.ok) throw new Error(`Δεν φορτώθηκε ${file} (${r.status})`);
      return (await r.text()).trim();
    }));
    const joined=parts.join('').replace(/\s/g,'');
    const raw=atob(joined);
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
    let html='';
    if('DecompressionStream' in window){
      try{
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        html=await new Response(stream).text();
      }catch(e){console.warn('Native gzip failed',e)}
    }
    if(!html){
      await new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';
        s.onload=resolve;s.onerror=()=>reject(new Error('Δεν φορτώθηκε το fallback αποσυμπίεσης.'));
        document.head.appendChild(s);
      });
      html=new TextDecoder().decode(window.pako.ungzip(bytes));
    }
    if(!html || !html.toLowerCase().includes('<html')) throw new Error('Το περιεχόμενο της σελίδας είναι κενό.');
    document.open();document.write(html);document.close();
  }catch(err){
    console.error(err);
    fail(err && err.message ? err.message : 'Δοκίμασε ξανά σε λίγο.');
  }
})();
</script>
</body>
</html>
